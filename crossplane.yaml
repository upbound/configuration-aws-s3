apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: configuration-aws-s3
  annotations:
    meta.crossplane.io/maintainer: The configuration-aws-s3 Configuration
    meta.crossplane.io/source: github.com/upbound/configuration-aws-s3
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      This configuration-aws-s3 configuration offers
      a rich composition of conditional S3 related
      resources.
    meta.crossplane.io/readme: |
      This Configuration bundles an Upbound Cloud
      extension and an API definition. The API will
      allow control planes to provision AWS S3
      instances with optional resources.
spec:
  crossplane:
    version: ">=v1.15.2-0"
  dependsOn:
    - provider: xpkg.upbound.io/upbound/provider-aws-s3
      version: "v1.4.0"
    - function: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform
      version: "v0.5.0"
    - function: xpkg.upbound.io/crossplane-contrib/function-go-templating
      version: "v0.4.1"
    - function: xpkg.upbound.io/crossplane-contrib/function-cel-filter
      version: "v0.1.1"
    - function: xpkg.upbound.io/crossplane-contrib/function-auto-ready
      version: "v0.2.1"
