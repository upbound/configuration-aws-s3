apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: buckets.s3.aws.platform.upbound.io
  labels:
    crossplane.io/xrd: buckets.s3.aws.platform.upbound.io
spec:
  compositeTypeRef:
    apiVersion: s3.aws.platform.upbound.io/v1alpha1
    kind: Bucket
  mode: Pipeline
  pipeline:
    # 1) Compose the bucket with its INTENDED managementPolicies
    #    (spec.parameters.managementPolicies, default ["*"]).
    - step: bucket
      functionRef:
        name: upbound-configuration-aws-s3bucket
    # 2) Resilience overlay: leader honors the intent above, standby reduces to
    #    Observe. This is the drop-in function; no embedded resilience logic.
    - step: management-policies
      functionRef:
        name: upbound-function-management-policies
      input:
        apiVersion: management-policies.fn.crossplane.io/v1beta1
        kind: Input
        passivePolicy:
          - Observe
    - step: auto-ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
