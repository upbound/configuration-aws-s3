apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: buckets.s3.aws.platform.upbound.io
spec:
  group: s3.aws.platform.upbound.io
  scope: Namespaced
  names:
    kind: Bucket
    plural: buckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - region
                    - bucketName
                  properties:
                    region:
                      type: string
                      description: AWS region for the bucket.
                    bucketName:
                      type: string
                      description: >-
                        Globally-unique S3 bucket name. Use the SAME value on every
                        control plane in a resilience set so they all reference the
                        one bucket (via crossplane.io/external-name); the leader
                        manages it, standbys observe it.
                    providerConfigName:
                      type: string
                      default: default
                    managementPolicies:
                      type: array
                      description: >-
                        The bucket's intended managementPolicies. Honored on the
                        resilience leader; reduced to ["Observe"] on standbys by
                        function-management-policies. Defaults to ["*"].
                      items:
                        type: string
                      default:
                        - "*"
            status:
              type: object
              properties:
                bucketName:
                  type: string
