apiVersion: s3.aws.platform.upbound.io/v1alpha1
kind: Bucket
metadata:
  name: shared-bucket
  namespace: default
spec:
  parameters:
    region: us-east-1
    # Globally unique. Apply the same bucketName on every control plane in a
    # resilience set so they all reference one bucket.
    bucketName: resilient-ctp-demo-shared-bucket
    # Intended policy, applied on the resilience leader only. Defaults to ["*"].
    managementPolicies: ["*"]
